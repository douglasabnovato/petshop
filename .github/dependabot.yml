# Dependabot: atualizações semanais de npm e GitHub Actions; patch e minor chegam juntos num PR por ecossistema
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    groups:
      npm-patch-minor:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: America/Sao_Paulo
    groups:
      actions-patch-minor:
        update-types: [minor, patch]
# Fim de dependabot.yml
