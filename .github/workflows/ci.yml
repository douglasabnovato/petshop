# CI: testes, build do Next.js (exportação estática em out/) e Playwright em PR e push; publicação no GitHub Pages só na main, depois do build verde
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'developer/**']
  # "Run workflow" na main republica o site (ex.: depois de ligar o Pages)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  raiz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      # Artefato do Pages só na main (push ou "Run workflow")
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        with:
          path: out

  # Publicação: só na main e só depois do job raiz verde
  deploy:
    needs: raiz
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
